name: pr-lint

# Wrapper tipis: logika di scripts/lint-pr-body.js (sumber tunggal, jalan lokal + CI).
# CI hanya enforcement otomatis; cek sesungguhnya: `node scripts/lint-pr-body.js <file|nomor-PR>`.

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  ui-changed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - uses: actions/checkout@v4
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path')
          echo "$files"
          if echo "$files" | grep -qE "^(apps/web|packages/ui)/.*\.(tsx|jsx|css|scss|svg|png|jpg|jpeg|webp|avif|gif|mp4|webm|woff2?|ttf|otf)$"; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

  body:
    runs-on: ubuntu-latest
    needs: ui-changed
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint PR body via skrip sumber tunggal
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          UI_TOUCHED: ${{ needs.ui-changed.outputs.touched }}
        run: node scripts/lint-pr-body.js --ci
